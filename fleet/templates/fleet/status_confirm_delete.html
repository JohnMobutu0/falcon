{% extends 'base.html' %}

{% block title %}Delete Status{% endblock %}

{% block content %}
{% include "fleet/navbar.html" %}
<br>

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-danger">
            <div class="card-header bg-danger text-white">
                <h3 class="card-title">Confirm Deletion</h3>
            </div>
            <div class="card-body">
                <p>Are you sure you want to delete the status "<strong>{{ object.name }}</strong>"?</p>
                <p class="text-muted">This action cannot be undone.</p>
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Yes, delete</button>
                    <a href="{% url 'fleet:status_list' %}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
