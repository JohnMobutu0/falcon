{% extends 'base.html' %}
{% load static%}

{% block title %}Delete Type{% endblock %}

{% block content %}
<link rel="stylesheet" href="{% static 'fleet/css/delete_type.css' %}">

{% include "fleet/navbar.html" %}

<div class="form-container">
    <div class="form-card danger-card">
        <div class="form-header danger-header">
            <h3>Confirm Deletion</h3>
        </div>
        <div class="form-body">
            <p>Are you sure you want to delete the type "<strong>{{ object.name }}</strong>"?</p>
            <p class="text-muted">This action cannot be undone.</p>
            <form method="post">
                {% csrf_token %}
                <div class="form-actions">
                    <button type="submit" class="btn-danger">Yes, delete</button>
                    <a href="{% url 'fleet:type_list' %}" class="btn-muted">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
