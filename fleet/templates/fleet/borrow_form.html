{% extends 'base.html' %}
{% load static%}

{% block title %}Borrow Automobile{% endblock %}

{% block content %}
<link rel="stylesheet" href="{% static 'fleet/css/borrow_automobile.css' %}">

{% include "fleet/navbar.html" %}

<div class="form-container">
    <div class="form-card">
        <div class="form-header">
            <h3>Borrow Automobile</h3>
        </div>
        <div class="form-body">
            <p><strong>Automobile:</strong> {{ auto.license_plate }} ({{ auto.make }} {{ auto.model }})</p>
            
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <div class="form-actions">
                    <button type="submit" class="btn-accent">Confirm Borrow</button>
                    <a href="{% url 'fleet:automobile_list' %}" class="btn-muted">Cancels</a>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
