<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - AutoManager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand mb-0 h1">Easy</span>
            <span class="text-light">Welcome, {{ user_name }}</span>
        </div>
    </nav>

    <div class="container mt-4">
        <h2>Dashboard</h2>
        <div class="row">
            <div class="col-md-4">
                <div class="card text-white bg-primary mb-3">
                    <div class="card-body">
                        <h5 class="card-title">Total Automobiles</h5>
                        <p class="card-text display-4">{{ total_autos }}</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-white bg-warning mb-3">
                    <div class="card-body">
                        <h5 class="card-title">Currently Borrowed</h5>
                        <p class="card-text display-4">{{ borrowed_count }}</p>
                    </div>
                </div>
            </div>
        </div>

        <hr>
        <h3>Management</h3>
        <div class="list-group">
            <a href="{% url 'fleet:dashboard' %}" class="list-group-item list-group-item-action">Manage Automobiles</a>
            <a href="{% url 'fleet:borrow_list' %}" class="list-group-item list-group-item-action">View Borrow Records</a>
            <a href="{% url 'fleet:type_list' %}" class="list-group-item list-group-item-action">Manage Automobile Types</a>
            <a href="{% url 'fleet:status_list' %}" class="list-group-item list-group-item-action">Manage Statuses</a>
        </div>
    </div>
</body>
</html>
